<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10263b"><title>Food Tracker</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div><span class="eyebrow">FOOD TRACKER</span><h1 id="day-title">Today</h1></div><button class="icon-button" id="settings-btn" aria-label="Settings">⚙</button></header>
<section class="gauge-card" aria-label="Daily calorie progress"><div class="gauge" id="gauge"><div class="gauge-inner"><span class="gauge-label" id="remaining-label">REMAINING</span><strong id="remaining">2,200</strong><span class="gauge-sub" id="eaten">0 eaten / 2,200 goal</span></div></div><div class="macro-row"><div><span>PROTEIN</span><strong id="protein">0 <small>/ 190g</small></strong></div><div><span>CARBS</span><strong id="carbs">0<small>g</small></strong></div></div></section>
<button id="log-btn" class="primary big">+ LOG FOOD</button><div class="quick-row"><button id="beer-btn">ADD BEER</button><button id="weight-btn">ENTER WEIGHT</button></div>
<section class="weight-card"><div class="section-top"><h2>Weight</h2><span id="weight-date"></span></div><div class="weight-main"><strong id="weight-current">—</strong><span>lb</span></div><div class="weight-stats"><span><b id="weight-lost">—</b> lost</span><span><b id="weight-left">—</b> to goal</span><span><b id="weight-trend">—</b> 7-day avg</span></div></section>
<section class="entries"><div class="section-top"><h2 id="entries-title">Today’s food</h2><button id="history-btn" class="text-button">History</button></div><div id="entry-list" class="entry-list"></div></section>
<nav><button id="home-tab" class="active">Today</button><button id="saved-tab">Saved foods</button><button id="history-tab">History</button></nav></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Close">×</button></div><div id="modal-body"></div></dialog><script src="app.js"></script></body></html>
